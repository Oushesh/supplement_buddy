version: "3.9"

services:
  # ── Django backend (port 8000) ─────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models
    depends_on:
      - db

  # ── Rust / Axum backend (port 8001) ────────────────────────────────────────
  # Drop-in high-performance alternative.  Both backends are kept running so
  # you can compare latency or switch the frontend's NEXT_PUBLIC_API_URL.
  backend_rust:
    build: ./backend_rust
    ports:
      - "8001:8001"
    env_file:
      - ./backend_rust/.env
    environment:
      DATABASE_URL: sqlite:///data/supplement_buddy.db
      HOST: 0.0.0.0
      PORT: "8001"
    volumes:
      - rust_db:/data

  # ── PostgreSQL (used by Django backend) ────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplement_buddy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      # Switch to http://localhost:8001/api to use the Rust backend
      NEXT_PUBLIC_API_URL: http://localhost:8000/api

volumes:
  postgres_data:
  rust_db:
